version: '3.8'
services:
  jenkins-docker:
    build:
      context: ./jenkins_docker/
    container_name: jenkins-docker
    restart: on-failure
    privileged: true
    networks:
      jenkins:
        aliases:
          - docker
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - docker_certs:/certs/client
      - jenkins_data:/var/jenkins_home
    ports:
      - "2376:2376"

  jenkins-blueocean:
    build:
      context: ./jenkins/
    container_name: jenkins-blueocean
    restart: on-failure
    networks:
      jenkins:
        aliases:
          - jenkins
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins_data:/var/jenkins_home
      - docker_certs:/certs/client:ro
    ports:
      - "8080:8080"
      - "50000:50000"
    depends_on:
      - jenkins-docker

networks:
  jenkins:

volumes:
  jenkins_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/jenkins_docker/data/jenkins_home/
  docker_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/jenkins_docker/data/docker_certs/